name: Build KinoKino

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: kinokino-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: kinokino-windows
          path: build/windows/x64/runner/Release/
