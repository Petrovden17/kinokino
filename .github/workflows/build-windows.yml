name: Build KinoKino for Windows

concurrency:
  group: kinokino-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      beta_release:
        description: "Опубликовать результат как бета-релиз"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "windows/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name=kinokino .

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: KinoKino-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Package beta release
        if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.beta_release) }}
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath KinoKino-Beta-Windows-x64.zip -Force

      - name: Publish beta release
        if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.beta_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: KinoKino Beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: KinoKino-Beta-Windows-x64.zip

