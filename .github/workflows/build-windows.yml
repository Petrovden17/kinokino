name: Build KinoKino for Windows

concurrency:
  group: kinokino-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      beta_release:
        description: "Опубликовать результат как бета-релиз"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "windows/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install NuGet and Inno Setup
        shell: pwsh
        run: |
          choco install nuget.commandline -y --no-progress
          choco install innosetup -y --no-progress
          "${env:ProgramData}\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name=kinokino .

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Repair Windows WebView CMake registration
        shell: pwsh
        run: |
          $pluginCmake = 'windows\flutter\ephemeral\.plugin_symlinks\flutter_inappwebview_forge_windows\windows\CMakeLists.txt'
          if (-not (Test-Path $pluginCmake)) { throw "Windows WebView CMake file not found: $pluginCmake" }
          $pluginSource = [IO.File]::ReadAllText((Resolve-Path $pluginCmake))
          # DEPENDS is invalid for add_custom_command(TARGET ... PRE_BUILD).
          $pluginPatched = [regex]::Replace($pluginSource, '(?m)^\s*DEPENDS\s+\$\{NUGET\}\s*\r?\n', '')
          if ($pluginPatched -notmatch 'add_dependencies\(\$\{PLUGIN_NAME\}\s+\$\{PROJECT_NAME\}_DEPS\)') {
            $libPattern = '(?s)(add_library\(\$\{PLUGIN_NAME\} SHARED.*?\r?\n\))'
            if ($pluginPatched -notmatch $libPattern) { throw 'Could not locate WebView add_library declaration.' }
            $pluginPatched = [regex]::Replace($pluginPatched, $libPattern, '$1' + "`r`nadd_dependencies(`${PLUGIN_NAME} `${PROJECT_NAME}_DEPS)", 1)
          }
          [IO.File]::WriteAllText((Resolve-Path $pluginCmake), $pluginPatched)

          # Register the WebView plugin explicitly if Flutter's generated list omitted it.
          $rootCmake = 'windows\CMakeLists.txt'
          $rootSource = [IO.File]::ReadAllText((Resolve-Path $rootCmake))
          $generatedMarker = 'include(flutter/generated_plugins.cmake)'
          if (-not $rootSource.Contains($generatedMarker)) { throw 'Could not find generated_plugins.cmake include.' }
          $fallback = @'
          if(NOT TARGET flutter_inappwebview_forge_windows_plugin)
            set(_forge_windows_plugin_dir "${CMAKE_CURRENT_LIST_DIR}/flutter/ephemeral/.plugin_symlinks/flutter_inappwebview_forge_windows/windows")
            if(NOT EXISTS "${_forge_windows_plugin_dir}/CMakeLists.txt")
              message(FATAL_ERROR "Forge WebView plugin CMakeLists.txt is missing: ${_forge_windows_plugin_dir}")
            endif()
            add_subdirectory("${_forge_windows_plugin_dir}" "${CMAKE_CURRENT_BINARY_DIR}/plugins/flutter_inappwebview_forge_windows_fallback")
          endif()
          '@
          if (-not $rootSource.Contains('flutter_inappwebview_forge_windows_fallback')) {
            $rootSource = $rootSource.Replace($generatedMarker, $generatedMarker + "`r`n" + $fallback)
            [IO.File]::WriteAllText((Resolve-Path $rootCmake), $rootSource)
          }
          if ($pluginPatched -match '(?m)^\s*DEPENDS\s+\$\{NUGET\}') { throw 'Invalid DEPENDS argument remains in WebView CMake.' }

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Create single-file Windows installer
        shell: pwsh
        run: |
          @'
          [Setup]
          AppId={{B1A8B60E-6F18-4E91-A6CE-6B63D6C8A21F}
          AppName=KinoKino
          AppVersion=1.0.${{ github.run_number }}
          AppPublisher=KinoKino
          DefaultDirName={autopf}\KinoKino
          DefaultGroupName=KinoKino
          OutputDir=Output
          OutputBaseFilename=KinoKino-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          Uninstallable=yes
          CloseApplications=yes
          RestartApplications=no
          PrivilegesRequired=admin

          [Tasks]
          Name: "desktopicon"; Description: "Создать ярлык на рабочем столе"; GroupDescription: "Дополнительные задачи:"; Flags: unchecked

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\KinoKino"; Filename: "{app}\kinokino.exe"
          Name: "{autodesktop}\KinoKino"; Filename: "{app}\kinokino.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\kinokino.exe"; Description: "Запустить KinoKino"; Flags: postinstall nowait skipifsilent
          '@ | Set-Content -Path KinoKino.iss -Encoding UTF8
          New-Item -ItemType Directory -Force -Path Output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" KinoKino.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }

      - name: Package Windows auto-update archive
        shell: pwsh
        run: |
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'Output\KinoKino-Beta-Windows-x64.zip' -Force
      - name: Upload single-file installer
        uses: actions/upload-artifact@v4
        with:
          name: KinoKino-Windows-Setup
          path: Output/KinoKino-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows auto-update archive
        uses: actions/upload-artifact@v4
        with:
          name: KinoKino-Windows-Update-Archive
          path: Output/KinoKino-Beta-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta installer
        if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.beta_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: KinoKino Beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            Output/KinoKino-Setup.exe
            Output/KinoKino-Beta-Windows-x64.zip
