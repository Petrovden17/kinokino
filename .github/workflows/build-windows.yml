name: Build KinoKino for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "windows/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name=kinokino .

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=APP_BUILD=6

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: KinoKino-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
