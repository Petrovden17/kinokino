name: Build KinoKino for Android

concurrency:
  group: kinokino-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner with a new non-conflicting application ID
        run: |
          flutter create --platforms=android --org com.osirisvectory --project-name=kinokino .
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source, count = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.osirisvectory.kinokino.next"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not set the new Android application ID")
          gradle.write_text(source, encoding="utf-8")
          PY

      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kinokino-android-signing-v1

      - name: Create persistent Android signing key if needed
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=KinoKino, OU=Android, O=KinoKino, L=Unknown, ST=Unknown, C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Allow legacy WebView ProGuard configuration on AGP 9
        run: echo 'android.r8.proguardAndroidTxt.disallowed=false' >> android/gradle.properties

      - name: Configure Android internet permission and session backup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if "android.permission.INTERNET" not in content:
              content = content.replace("    <application", permission + "    <application", 1)

          app_start = content.find("<application")
          app_end = content.find(">", app_start)
          if app_start < 0 or app_end < 0:
              raise SystemExit("Android manifest has no valid application element")
          app_tag = content[app_start:app_end]
          additions = []
          if "android:allowBackup=" not in app_tag:
              additions.append('android:allowBackup="true"')
          if "android:fullBackupContent=" not in app_tag:
              additions.append('android:fullBackupContent="@xml/backup_rules"')
          if "android:dataExtractionRules=" not in app_tag:
              additions.append('android:dataExtractionRules="@xml/data_extraction_rules"')
          if additions:
              content = content[:app_end] + " " + " ".join(additions) + content[app_end:]
          manifest.write_text(content, encoding="utf-8")

          resources = Path("android/app/src/main/res/xml")
          resources.mkdir(parents=True, exist_ok=True)
          (resources / "backup_rules.xml").write_text(
              '<full-backup-content>\n    <include domain="sharedpref" path="FlutterSharedPreferences.xml" />\n</full-backup-content>\n',
              encoding="utf-8")
          (resources / "data_extraction_rules.xml").write_text(
              '<data-extraction-rules>\n    <cloud-backup>\n        <include domain="sharedpref" path="FlutterSharedPreferences.xml" />\n    </cloud-backup>\n    <device-transfer>\n        <include domain="sharedpref" path="FlutterSharedPreferences.xml" />\n    </device-transfer>\n</data-extraction-rules>\n',
              encoding="utf-8")
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="true"' android/app/src/main/AndroidManifest.xml

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Verify stable Android signing configuration
        if: ${{ env.HAS_ANDROID_KEYSTORE != 'true' }}
        run: test -s "$HOME/.android/debug.keystore"
      - name: Configure persistent Android release signing
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          android = Path("android")
          app = android / "app"
          (app / "upload-keystore.jks").write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"]))
          (android / "key.properties").write_text(
              "storePassword=" + os.environ["ANDROID_KEYSTORE_PASSWORD"] + "\n" +
              "keyPassword=" + os.environ["ANDROID_KEY_PASSWORD"] + "\n" +
              "keyAlias=" + os.environ["ANDROID_KEY_ALIAS"] + "\n" +
              "storeFile=app/upload-keystore.jks\n",
              encoding="utf-8",
          )
          gradle = app / "build.gradle.kts"
          source = gradle.read_text(encoding="utf-8")
          imports = "import java.io.FileInputStream\nimport java.util.Properties\n"
          source = imports + source
          source = source.replace(
              "android {",
              """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }
          }

          android {""",
              1,
          )
          source = source.replace(
              "    buildTypes {",
              """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {""",
              1,
          )
          source = source.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1,
          )
          gradle.write_text(source, encoding="utf-8")
          PY

      - name: Build Android APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}

      # Build a separate test-only APK that opens a known title directly.
      # The release APK above remains the normal user-facing application.
      - name: Build Android player smoke-test APK
        run: flutter build apk --debug --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=KINO_PLAYER_SMOKE_TEST=true

      - name: Verify the embedded video player in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.osirisvectory.kinokino.next 1
            sleep 75
            adb logcat -d -v time > player-smoke-logcat.txt
            adb exec-out screencap -p > player-smoke-screen.png
            python3 - <<'PY'
            import json, re, sys
            from pathlib import Path

            log = Path("player-smoke-logcat.txt").read_text(errors="replace")
            probes = re.findall(r"PLAYER_PROBE[^\\n]*?(\\{.*?\\})(?=\\s*$|\\r?$)", log, re.M)
            parsed = []
            for raw in probes:
                try:
                    parsed.append(json.loads(raw))
                except json.JSONDecodeError:
                    pass

            if not parsed:
                print("FAIL: no player DOM diagnostics were emitted; popup/player did not load.")
                sys.exit(1)

            for item in parsed:
                print("PLAYER PROBE:", json.dumps(item, ensure_ascii=False))
            loaded = any(
                any(v.get("visible") and (v.get("width", 0) > 0 or v.get("height", 0) > 0)
                    for v in item.get("videos", []))
                or item.get("playerFrameCount", 0) > 0
                for item in parsed
            )
            if not loaded:
                print("FAIL: no visible HTML video element or visible player iframe found.")
                sys.exit(1)
            print("PASS: visible video element or player iframe detected.")
            PY

      - name: Upload Android player smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KinoKino-Android-Player-Smoke-Test
          path: |
            player-smoke-logcat.txt
            player-smoke-screen.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KinoKino-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
