name: Build KinoKino for Android

concurrency:
  group: kinokino-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - android/android9plus-from-build-213
      - android/catalog-settings-polish-from-213
    paths:
      - ".github/workflows/build-android.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner with a new non-conflicting application ID
        run: |
          flutter create --platforms=android --org com.osirisvectory --project-name=kinokino .
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source, count = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.osirisvectory.kinokino.next"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not set the new Android application ID")
          gradle.write_text(source, encoding="utf-8")
          PY

      - name: Configure Android 9+ and modern native-library compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")

          source, min_count = re.subn(
              r'minSdk\s*=\s*(?:flutter\.minSdkVersion|[0-9]+)',
              'minSdk = 21',
              source,
              count=1,
          )
          if min_count != 1:
              raise SystemExit("Could not explicitly set minSdk to 21 (Android 5.0+; includes Android 9+)")

          source, ndk_count = re.subn(
              r'ndkVersion\s*=\s*[^\n]+',
              'ndkVersion = "28.2.13676358"',
              source,
              count=1,
          )
          if ndk_count != 1:
              raise SystemExit("Could not set Android NDK r28")

          if "useLegacyPackaging" not in source:
              source = source.replace(
                  "    buildTypes {",
                  '    packaging {\n        jniLibs {\n            useLegacyPackaging = false\n        }\n    }\n\n    buildTypes {',
                  1,
              )
          if "useLegacyPackaging = false" not in source:
              raise SystemExit("Could not enable uncompressed native library packaging")

          gradle.write_text(source, encoding="utf-8")
          print("Configured minSdk=21, NDK r28 and 16 KB-friendly JNI packaging")
          PY

          echo "Generated Android Gradle configuration:"
          grep -nE 'ndkVersion|minSdk|useLegacyPackaging' android/app/build.gradle.kts

      - name: Verify Android 9+ and APK native alignment
        run: |
          set -euo pipefail
          grep -q 'minSdk = 21' android/app/build.gradle.kts
          grep -q 'ndkVersion = "28.2.13676358"' android/app/build.gradle.kts

      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kinokino-android-signing-v1

      - name: Create persistent Android signing key if needed
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=KinoKino, OU=Android, O=KinoKino, L=Unknown, ST=Unknown, C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Allow legacy WebView ProGuard configuration on AGP 9
        run: echo 'android.r8.proguardAndroidTxt.disallowed=false' >> android/gradle.properties

      - name: Configure Android internet permission and session backup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if "android.permission.INTERNET" not in content:
              content = content.replace("    <application", permission + "    <application", 1)

          app_start = content.find("<application")
          app_end = content.find(">", app_start)
          if app_start < 0 or app_end < 0:
              raise SystemExit("Android manifest has no valid application element")
          app_tag = content[app_start:app_end]
          additions = []
          if "android:allowBackup=" not in app_tag:
              additions.append('android:allowBackup="true"')
          if "android:fullBackupContent=" not in app_tag:
              additions.append('android:fullBackupContent="@xml/backup_rules"')
          if "android:dataExtractionRules=" not in app_tag:
              additions.append('android:dataExtractionRules="@xml/data_extraction_rules"')
          if additions:
              content = content[:app_end] + " " + " ".join(additions) + content[app_end:]
          manifest.write_text(content, encoding="utf-8")

          resources = Path("android/app/src/main/res/xml")
          resources.mkdir(parents=True, exist_ok=True)
          (resources / "backup_rules.xml").write_text(
              '<full-backup-content>\n    <include domain="sharedpref" path="FlutterSharedPreferences.xml" />\n</full-backup-content>\n',
              encoding="utf-8")
          (resources / "data_extraction_rules.xml").write_text(
              '<data-extraction-rules>\n    <cloud-backup>\n        <include domain="sharedpref" path="FlutterSharedPreferences.xml" />\n    </cloud-backup>\n    <device-transfer>\n        <include domain="sharedpref" path="FlutterSharedPreferences.xml" />\n    </device-transfer>\n</data-extraction-rules>\n',
              encoding="utf-8")

          # Allow the app to hand a downloaded APK to Android's package installer.
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\\n'
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in content:
              content = content.replace("    <application", permission + "    <application", 1)
          provider = '''        <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="${applicationId}.fileprovider"
              android:exported="false"
              android:grantUriPermissions="true">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/apk_file_paths" />
          </provider>
          '''
          if "androidx.core.content.FileProvider" not in content:
              content = content.replace("    </application>", provider + "    </application>", 1)
          manifest.write_text(content, encoding="utf-8")

          (resources / "apk_file_paths.xml").write_text(
              '<paths xmlns:android="http://schemas.android.com/apk/res/android">\\n'
              '    <cache-path name="apk_updates" path="apk_updates/" />\\n'
              '</paths>\\n',
              encoding="utf-8")

          activity = Path("android/app/src/main/kotlin/com/osirisvectory/kinokino/MainActivity.kt")
          activity.parent.mkdir(parents=True, exist_ok=True)
          activity.write_text("""package com.osirisvectory.kinokino

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "kinokino/android_installer")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "installApk") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          val path = call.argument<String>("path")
                          val apk = path?.let { File(it) }
                          if (apk == null || !apk.isFile) {
                              result.error("APK_NOT_FOUND", "Downloaded APK was not found.", null)
                              return@setMethodCallHandler
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                              !packageManager.canRequestPackageInstalls()) {
                              val settings = Intent(
                                  Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  Uri.parse("package:$packageName")
                              )
                              startActivity(settings)
                              result.success(false)
                              return@setMethodCallHandler
                          }
                          try {
                              val uri = FileProvider.getUriForFile(
                                  this, "$packageName.fileprovider", apk
                              )
                              val install = Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(uri, "application/vnd.android.package-archive")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(install)
                              result.success(true)
                          } catch (error: Exception) {
                              result.error("INSTALL_INTENT_FAILED", error.message, null)
                          }
                      }
              }
          }
          """, encoding="utf-8")
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="true"' android/app/src/main/AndroidManifest.xml

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Verify stable Android signing configuration
        if: ${{ env.HAS_ANDROID_KEYSTORE != 'true' }}
        run: test -s "$HOME/.android/debug.keystore"
      - name: Configure persistent Android release signing
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          android = Path("android")
          app = android / "app"
          (app / "upload-keystore.jks").write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"]))
          (android / "key.properties").write_text(
              "storePassword=" + os.environ["ANDROID_KEYSTORE_PASSWORD"] + "\n" +
              "keyPassword=" + os.environ["ANDROID_KEY_PASSWORD"] + "\n" +
              "keyAlias=" + os.environ["ANDROID_KEY_ALIAS"] + "\n" +
              "storeFile=app/upload-keystore.jks\n",
              encoding="utf-8",
          )
          gradle = app / "build.gradle.kts"
          source = gradle.read_text(encoding="utf-8")
          imports = "import java.io.FileInputStream\nimport java.util.Properties\n"
          source = imports + source
          source = source.replace(
              "android {",
              """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }
          }

          android {""",
              1,
          )
          source = source.replace(
              "    buildTypes {",
              """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {""",
              1,
          )
          source = source.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1,
          )
          gradle.write_text(source, encoding="utf-8")
          PY

      - name: Build Android APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Verify APK ZIP alignment for 16 KB page devices
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"

      - name: Upload APK
        if: always() && hashFiles('build/app/outputs/flutter-apk/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: KinoKino-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android beta release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KinoKino Android Beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
