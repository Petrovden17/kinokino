name: Build KinoKino for Android

concurrency:
  group: kinokino-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create --platforms=android --org com.osirisvectory --project-name=kinokino .

      - name: Allow legacy WebView ProGuard configuration on AGP 9
        run: echo 'android.r8.proguardAndroidTxt.disallowed=false' >> android/gradle.properties

      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if "android.permission.INTERNET" not in content:
              marker = "    <application"
              if marker not in content:
                  raise SystemExit("Android manifest has no application element")
              content = content.replace(marker, permission + marker, 1)
              manifest.write_text(content, encoding="utf-8")
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Configure persistent Android release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          android = Path("android")
          app = android / "app"
          (app / "upload-keystore.jks").write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"]))
          (android / "key.properties").write_text(
              "storePassword=" + os.environ["ANDROID_KEYSTORE_PASSWORD"] + "\n" +
              "keyPassword=" + os.environ["ANDROID_KEY_PASSWORD"] + "\n" +
              "keyAlias=" + os.environ["ANDROID_KEY_ALIAS"] + "\n" +
              "storeFile=app/upload-keystore.jks\n",
              encoding="utf-8",
          )
          gradle = app / "build.gradle.kts"
          source = gradle.read_text(encoding="utf-8")
          imports = "import java.io.FileInputStream\nimport java.util.Properties\n"
          source = imports + source
          source = source.replace(
              "android {",
              """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }
          }

          android {""",
              1,
          )
          source = source.replace(
              "    buildTypes {",
              """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {""",
              1,
          )
          source = source.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1,
          )
          gradle.write_text(source, encoding="utf-8")
          PY

      - name: Build Android APK
        run: flutter build apk --release --dart-define=APP_BUILD=9

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KinoKino-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
